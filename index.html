<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy 25th Birthday Ria!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-wall: #fce4ec;
      --bg-floor: #d7ccc8;
      --dialogue-bg: #2d1b2e;
      --dialogue-border: #f8bbd0;
      --dialogue-text: #ffffff;
    }

    * {
      box-sizing: border-box; margin: 0; padding: 0;
      image-rendering: pixelated; image-rendering: crisp-edges; user-select: none;
    }

    body {
      background-color: #060913; 
      font-family: 'Press Start 2P', monospace;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; overflow: hidden;
    }

    #game-container {
      position: relative; width: 100vw; max-width: 440px; height: 100vh; max-height: 820px;
      overflow: hidden; display: flex; flex-direction: column;
    }

    .fade-item { transition: opacity 1s ease; }
    body.outside-mode .fade-item { opacity: 0; pointer-events: none; }
    body.outside-mode .couple-img { filter: drop-shadow(0 0 15px rgba(255,255,255,0.15)) brightness(0.7); }

    canvas#particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px; z-index: 25; position: relative; }
    .pixel-btn { font-family: 'Press Start 2P', monospace; font-size: 10px; padding: 6px 10px; background: #ffffff; border: 3px solid #000000; cursor: pointer; box-shadow: 2px 2px 0px #000000; }
    .pixel-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #000000; }

    /* Banner & Sparkles */
    .banner-container { position: absolute; top: 65px; left: 0; width: 100%; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none; }
    .banner-row { display: flex; justify-content: center; gap: 6px; }
    .pennant { width: 26px; height: 30px; background: #f48fb1; border: 2px solid #ffffff; color: #ffffff; display: flex; justify-content: center; align-items: center; font-size: 14px; text-shadow: 1px 1px 0px rgba(0,0,0,0.2); border-radius: 2px 2px 6px 6px; animation: pulseGlow 1.5s infinite alternate; }
    @keyframes pulseGlow { 0% { box-shadow: 0 0 2px #ff4081, 2px 2px 0px rgba(0,0,0,0.15); } 100% { box-shadow: 0 0 12px #ff4081, 2px 2px 0px rgba(0,0,0,0.15); } }
    
    .banner-row:nth-child(1) .pennant:nth-child(odd) { transform: translateY(2px) rotate(4deg); }
    .banner-row:nth-child(1) .pennant:nth-child(even) { transform: translateY(-2px) rotate(-2deg); }
    .banner-row:nth-child(2) .pennant { font-size: 10px; width: 22px; height: 26px; }
    .banner-row:nth-child(2) .pennant:nth-child(odd) { transform: translateY(-1px) rotate(-3deg); }
    .banner-row:nth-child(2) .pennant:nth-child(even) { transform: translateY(1px) rotate(3deg); }
    .banner-row:nth-child(3) .pennant:nth-child(odd) { transform: translateY(2px) rotate(-2deg); }
    .banner-row:nth-child(3) .pennant:nth-child(even) { transform: translateY(-2px) rotate(4deg); }

    .sparkle { position: absolute; width: 14px; height: 14px; animation: twinkle 1s infinite alternate; }
    .sparkle::before, .sparkle::after { content: ''; position: absolute; background: #fff; border-radius: 2px; box-shadow: 0 0 4px #ff4081; }
    .sparkle::before { width: 100%; height: 2px; top: 6px; left: 0; }
    .sparkle::after { width: 2px; height: 100%; top: 0; left: 6px; }

    /* Separation Line Below Banner */
    .room-trim { position: absolute; top: 210px; left: 0; width: 100%; height: 4px; background: #d7ccc8; border-top: 2px solid #bcaaa4; border-bottom: 2px solid #bcaaa4; z-index: 4; }

    /* Outside Elements */
    .outside-scenery { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 2; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; }
    body.outside-mode .outside-scenery { opacity: 1; pointer-events: auto; }

    /* Star Layers */
    .star-layer { position: absolute; top: 0; left: 0; background: transparent; border-radius: 50%; z-index: 1; }
    #star-layer-1 { width: 1px; height: 1px; animation: twinkle 1.5s infinite alternate; }
    #star-layer-2 { width: 2px; height: 2px; animation: twinkle 2.2s infinite alternate 0.5s; }
    #star-layer-3 { width: 3px; height: 3px; animation: twinkle 3s infinite alternate 1.2s; }

    /* Moon */
    .moon {
      position: absolute; top: 12%; right: 15%; width: 36px; height: 36px;
      background: #fffde7; border-radius: 50%; box-shadow: 0 0 20px rgba(255, 245, 157, 0.6);
      z-index: 1;
    }

    /* Grass Hill and Decorations */
    .grass-hill { position: absolute; bottom: 0; left: -10%; width: 120%; height: 32%; background: #143019; border-top: 4px solid #1c4423; border-radius: 50% 50% 0 0; overflow: hidden; }
    
    .deco-flower {
      position: absolute; width: 4px; height: 4px; background: #ffca28;
      box-shadow: -4px 0 var(--flower-color, #4fc3f7), 4px 0 var(--flower-color, #4fc3f7), 0 -4px var(--flower-color, #4fc3f7), 0 4px var(--flower-color, #4fc3f7);
    }
    .deco-grass {
      position: absolute; width: 2px; height: 6px; background: #4caf50;
      box-shadow: 4px 2px #4caf50, -4px 4px #4caf50;
    }

    .motorcycle { position: absolute; bottom: 22%; right: 12%; width: 140px; cursor: pointer; transition: transform 0.2s ease; z-index: 15; }
    .motorcycle:hover { transform: scale(1.05); }
    .motorcycle img { width: 100%; height: auto; display: block; image-rendering: pixelated; }

    /* Room Wallpaper */
    .room-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, var(--bg-wall) 68%, var(--bg-floor) 68%); z-index: 4; }

    .interactive-item { cursor: pointer; transition: transform 0.1s ease; }
    .interactive-item:hover { transform: scale(1.04); }

    /* Middle Door */
    .door { position: absolute; bottom: 32%; left: 30%; width: 50px; height: 105px; background: #5d4037; border: 4px solid #3e2723; z-index: 5; }
    .door-top-panel { position: absolute; top: 6px; left: 6px; right: 6px; height: 38px; border: 2px solid #4e342e; }
    .door-bottom-panel { position: absolute; bottom: 6px; left: 6px; right: 6px; height: 38px; border: 2px solid #4e342e; }
    .door-knob { position: absolute; top: 50%; left: 6px; width: 6px; height: 6px; background: #ffca28; border-radius: 50%; box-shadow: 1px 1px 0px #3e2723; transform: translateY(-50%); }

    /* Left Side Guitar */
    .guitar-container { position: absolute; bottom: 35%; left: 5%; z-index: 5; }
    .guitar-img { height: 120px; width: auto; display: block; image-rendering: pixelated; transform: rotate(0deg); }

    /* Smaller Window */
    .pixel-window { position: absolute; bottom: 45%; right: 25%; width: 48px; height: 64px; background: #0b1021; border: 3px solid #4a3b32; box-shadow: inset 0 0 10px rgba(0,0,0,0.6), 2px 2px 0px rgba(0,0,0,0.1); overflow: hidden; z-index: 5; }
    .pixel-window::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 4px; background: #4a3b32; transform: translateY(-50%); z-index: 2; }
    .pixel-window::after { content: ''; position: absolute; top: 0; left: 50%; width: 4px; height: 100%; background: #4a3b32; transform: translateX(-50%); z-index: 2; }
    .window-grass { position: absolute; bottom: 0; left: 0; width: 100%; height: 18px; background: #143019; border-top: 2px solid #1c4423; z-index: 1; }
    
    .star { position: absolute; background: #ffffff; width: 2px; height: 2px; animation: twinkle 1.5s infinite alternate; }
    .star-1 { top: 10px; left: 12px; animation-delay: 0s; } .star-2 { top: 20px; left: 40px; animation-delay: 0.7s; width: 3px; height: 3px; }
    .star-3 { top: 55px; left: 15px; animation-delay: 1.2s; } .star-4 { top: 65px; left: 45px; animation-delay: 0.3s; }

    /* Bed PNG Container with Cat */
    .bed-container {
      position: absolute;
      bottom: 20%;
      left: 0.5%;
      width: 200px;
      z-index: 12;
    }

    .bed-img {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: pixelated;
    }

    .bed-items {
      position: absolute;
      top: 35px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 13;
    }

    .cat-container { }
    .cat-img { height: 100px; width: auto; display: block; image-rendering: pixelated; }

    /* Couple */
    .couple-position { position: absolute; bottom: 18%; left: 50%; transform: translateX(-50%); z-index: 12; animation: idleBob 1.4s ease-in-out infinite alternate; transition: left 1.5s ease; }
    body.outside-mode .couple-position { left: 25%; }
    .couple-img { max-height: 240px; width: auto; display: block; transition: filter 1s ease; }
    @keyframes idleBob { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }

    /* Table & Cake */
    .furniture-group { position: absolute; bottom: 18%; right: 10%; z-index: 12; display: flex; flex-direction: column; align-items: center; }
    .table-top-items { display: flex; align-items: flex-end; gap: 8px; margin-bottom: -2px; }
    .vase-img { max-height: 70px; width: auto; display: block; transform: translateY(9px); position: relative; z-index: 2; }
    
    .cake-container { width: 72px; height: 44px; background: linear-gradient(to bottom, #4e342e 0%, #4e342e 30%, #3e2723 30%, #3e2723 70%, #2b1a17 70%, #2b1a17 100%); border: 3px solid #1f0000; border-radius: 6px; border-bottom: 5px solid #cfd8dc; position: relative; display: flex; justify-content: center; box-shadow: 0px 2px 0px rgba(0,0,0,0.2); }
    .cake-frosting { position: absolute; top: 0; left: 0; width: 100%; height: 14px; background: #271300; border-radius: 4px 4px 0 0; border-bottom: 3px dotted #180900; }
    .cake-container::before { content: ''; position: absolute; width: 4px; height: 4px; background: #ffca28; top: 18px; left: 10px; box-shadow: 18px 6px 0 #a1887f, 36px -2px 0 #ffca28, 10px 10px 0 #ffca28, 28px 12px 0 #a1887f, 46px 2px 0 #00e5ff; z-index: 1; }
    .candle { position: absolute; top: -14px; width: 6px; height: 14px; background: #81d4fa; border: 2px solid #000000; z-index: 2; }
    .candle-1 { left: 20px; } .candle-2 { right: 20px; }
    .flame { position: absolute; top: -9px; left: -2px; width: 6px; height: 8px; background: #ffeb3b; border: 1px solid #ff5722; animation: flicker 0.3s infinite alternate; }
    .flame.extinguished { display: none; }
    .cake-label { position: absolute; bottom: 4px; font-size: 10px; color: #ffffff; text-shadow: 1px 1px 0 #1f0000; z-index: 2; }
    .table-stand { width: 130px; height: 44px; background: #bcaaa4; border: 3px solid #4a3b32; border-top: 5px solid #8d6e63; border-radius: 2px; }

    @keyframes twinkle { 0% { opacity: 0.2; } 100% { opacity: 1; } }
    @keyframes flicker { 0% { transform: scale(1); } 100% { transform: scale(1.2) translateY(-1px); } }

    /* Dialogue Layer */
    .dialogue-wrapper { position: absolute; bottom: 15px; left: 15px; right: 15px; z-index: 30; }
    .dialogue-box { background: var(--dialogue-bg); border: 4px solid var(--dialogue-border); border-radius: 6px; display: flex; gap: 12px; padding: 10px; min-height: 90px; box-shadow: 0 4px 0 #000; cursor: pointer; }
    .portrait { width: 60px; height: 60px; border: 2px solid #ffffff; background: #000; flex-shrink: 0; overflow: hidden; }
    .portrait img { width: 100%; height: 100%; object-fit: cover; }
    .dialogue-content { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .speaker-name { color: #f48fb1; font-size: 10px; margin-bottom: 6px; }
    .dialogue-text { color: var(--dialogue-text); font-size: 9px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .dialogue-prompt { align-self: flex-end; font-size: 8px; color: #f8bbd0; animation: blink 0.8s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>

<div id="game-container">
  
  <div class="outside-scenery">
    <div id="star-layer-1" class="star-layer"></div>
    <div id="star-layer-2" class="star-layer"></div>
    <div id="star-layer-3" class="star-layer"></div>
    <div class="moon"></div>
    
    <div class="grass-hill">
      <div class="deco-flower" style="top: 20px; left: 10%; --flower-color: #ffffff;"></div>
      <div class="deco-flower" style="top: 40px; left: 25%; --flower-color: #ff4081;"></div>
      <div class="deco-flower" style="top: 15px; left: 35%; --flower-color: #4fc3f7;"></div>
      <div class="deco-flower" style="top: 50px; left: 45%; --flower-color: #ff7043;"></div>
      <div class="deco-flower" style="top: 25px; left: 55%; --flower-color: #ab47bc;"></div>
      <div class="deco-flower" style="top: 35px; left: 70%; --flower-color: #ffffff;"></div>
      <div class="deco-flower" style="top: 15px; left: 85%; --flower-color: #4fc3f7;"></div>
      <div class="deco-flower" style="top: 40px; left: 90%; --flower-color: #ff4081;"></div>
      <div class="deco-flower" style="top: 30px; left: 18%; --flower-color: #fff176;"></div>
      <div class="deco-flower" style="top: 10px; left: 40%; --flower-color: #e040fb;"></div>
      <div class="deco-flower" style="top: 45px; left: 60%; --flower-color: #ffffff;"></div>
      <div class="deco-flower" style="top: 20px; left: 80%; --flower-color: #ffca28;"></div>
      <div class="deco-flower" style="top: 35px; left: 95%; --flower-color: #ff4081;"></div>
      
      <div class="deco-grass" style="top: 15px; left: 15%;"></div>
      <div class="deco-grass" style="top: 35px; left: 30%;"></div>
      <div class="deco-grass" style="top: 10px; left: 50%;"></div>
      <div class="deco-grass" style="top: 45px; left: 65%;"></div>
      <div class="deco-grass" style="top: 25px; left: 80%;"></div>
      <div class="deco-grass" style="top: 35px; left: 95%;"></div>
    </div>
    
    <div class="motorcycle" onclick="goInside()">
      <img src="assets/bike.png" alt="Cafe Racer Bike" />
    </div>
  </div>

  <div class="room-bg fade-item"></div>

  <canvas id="particles"></canvas>

  <div class="top-bar">
    <button class="pixel-btn" id="music-btn" onclick="toggleAudio()">Music: OFF</button>
    <button class="pixel-btn fade-item" onclick="triggerConfetti()">Celebrate</button>
  </div>

  <div class="banner-container fade-item">
    <div class="sparkle" style="top: -5px; left: 15%;"></div>
    <div class="sparkle" style="top: 20px; right: 15%;"></div>
    <div class="sparkle" style="bottom: -10px; left: 45%;"></div>
    <div class="banner-row">
      <div class="pennant">H</div><div class="pennant">A</div><div class="pennant">P</div><div class="pennant">P</div><div class="pennant">Y</div>
    </div>
    <div class="banner-row">
      <div class="pennant">2</div><div class="pennant">5</div><div class="pennant">T</div><div class="pennant">H</div>
    </div>
    <div class="banner-row">
      <div class="pennant">B</div><div class="pennant">I</div><div class="pennant">R</div><div class="pennant">T</div><div class="pennant">H</div><div class="pennant">D</div><div class="pennant">A</div><div class="pennant">Y</div>
    </div>
  </div>

  <div class="room-trim fade-item"></div>

  <div class="door fade-item interactive-item" onclick="goOutside()">
    <div class="door-top-panel"></div>
    <div class="door-bottom-panel"></div>
    <div class="door-knob"></div>
  </div>

  <div class="guitar-container fade-item interactive-item" onclick="interactGuitar()">
    <img src="assets/guitar.png" alt="Guitar" class="guitar-img" />
  </div>

  <div class="pixel-window fade-item interactive-item" onclick="interactWindow()">
    <div class="star star-1"></div>
    <div class="star star-2"></div>
    <div class="star star-3"></div>
    <div class="star star-4"></div>
    <div class="window-grass"></div>
  </div>

  <!-- Bed Container with Cat Only -->
  <div class="bed-container fade-item">
    <div class="bed-items">
      <div class="cat-container interactive-item" onclick="interactCat()">
        <img src="assets/cat.png" alt="Cat" class="cat-img" />
      </div>
    </div>
    <img src="assets/bed.png" alt="Bed" class="bed-img" />
  </div>

  <div class="couple-position interactive-item" onclick="interactCouple()">
    <img src="assets/couple.png" alt="San and Ria" class="couple-img" id="couple-sprite" />
  </div>

  <div class="furniture-group fade-item">
    <div class="table-top-items">
      <div class="interactive-item" onclick="interactFlowers()">
        <img src="assets/flowers.png" alt="Bouquet" class="vase-img" />
      </div>
      <div class="cake-container interactive-item" onclick="blowCandles()">
        <div class="candle candle-1"><div class="flame" id="flame1"></div></div>
        <div class="candle candle-2"><div class="flame" id="flame2"></div></div>
        <div class="cake-frosting"></div>
        <span class="cake-label">25</span>
      </div>
    </div>
    <div class="table-stand"></div>
  </div>

  <div class="dialogue-wrapper" onclick="advanceDialogue()">
    <div class="dialogue-box">
      <div class="portrait">
        <img id="portrait-img" src="assets/san.png" alt="Portrait" />
      </div>
      <div class="dialogue-content">
        <div>
          <div class="speaker-name" id="speaker-name">San</div>
          <div class="dialogue-text" id="dialogue-text">Tap anywhere in the room to explore...</div>
        </div>
        <div class="dialogue-prompt">[Tap to continue]</div>
      </div>
    </div>
  </div>
</div>

<audio id="bg-audio" loop src="assets/music.mp3"></audio>

<script>
  let candlesBlown = false;
  let giftOpened = false;
  let isOutside = false;
  let typingTimer = null;

  const script = {
    intro: { speaker: "San", portrait: "assets/san.png", text: "Happy 25th Birthday, Ria! Welcome to your room." },
    flowers: { speaker: "San", portrait: "assets/san.png", text: "A fresh bouquet of blue lilies for your special day!" },
    cake: { speaker: "Ria", portrait: "assets/ria.png", text: "Chocolate truffle cake! Make a wish. 25 is going to be our best year yet." },
    couple: { speaker: "San", portrait: "assets/san.png", text: "September 9th is all about you. I love you, Bebo <3" },
    window: { speaker: "San", portrait: "assets/san.png", text: "Even with the miles between us, we share the same night sky." },
    guitar: { speaker: "San", portrait: "assets/san.png", text: "I keep thinking about the acoustic song I wrote for our second anniversary. Every lyric is still true today." },
    gift: { speaker: "San", portrait: "assets/san.png", text: "I packed this one with just as much love as the care package with the cookies I sent for our anniversary." },
    cat: { speaker: "San", portrait: "assets/san.png", text: "A little pixel companion to keep you company in your room!" }
  };

  window.onload = function() {
    function generateStars(id, count) {
      let shadow = '';
      for (let i = 0; i < count; i++) {
        let x = Math.floor(Math.random() * window.innerWidth);
        let y = Math.floor(Math.random() * window.innerHeight);
        shadow += `${x}px ${y}px #FFF, `;
      }
      document.getElementById(id).style.boxShadow = shadow.slice(0, -2);
    }
    generateStars('star-layer-1', 60);
    generateStars('star-layer-2', 30);
    generateStars('star-layer-3', 10);
  };

  function typeText(speaker, portrait, text) {
    clearTimeout(typingTimer);
    document.getElementById("speaker-name").textContent = speaker;
    document.getElementById("portrait-img").src = portrait;
    
    const textElem = document.getElementById("dialogue-text");
    textElem.textContent = "";
    let i = 0;

    function step() {
      if (i <= text.length) {
        textElem.textContent = text.slice(0, i);
        i++;
        typingTimer = setTimeout(step, 30);
      }
    }
    step();
  }

  function interactCouple() {
    if (!isOutside) {
      typeText(script.couple.speaker, script.couple.portrait, script.couple.text);
      triggerHearts();
    }
  }

  function interactFlowers() { typeText(script.flowers.speaker, script.flowers.portrait, script.flowers.text); triggerPetals(); }
  function interactWindow() { typeText(script.window.speaker, script.window.portrait, script.window.text); }
  function interactGuitar() { typeText(script.guitar.speaker, script.guitar.portrait, script.guitar.text); triggerNotes(); }
  
  function interactCat() { 
    typeText(script.cat.speaker, script.cat.portrait, script.cat.text); 
    triggerHearts(); 
  }

  function interactGift() {
    if (!giftOpened) {
      document.getElementById("gift").classList.add("open");
      giftOpened = true;
      typeText(script.gift.speaker, script.gift.portrait, script.gift.text);
      triggerConfetti();
    } else {
      typeText(script.gift.speaker, script.gift.portrait, "The gift is open! I hope you love it.");
    }
  }

  function blowCandles() {
    if (!candlesBlown) {
      document.getElementById("flame1").classList.add("extinguished");
      document.getElementById("flame2").classList.add("extinguished");
      candlesBlown = true;
      typeText(script.cake.speaker, script.cake.portrait, script.cake.text);
      triggerConfetti();
    } else {
      typeText(script.cake.speaker, script.cake.portrait, "The candles are out, but the wish is already set in stone!");
    }
  }

  function goOutside() {
    isOutside = true;
    document.body.classList.add("outside-mode");
    typeText("San", "assets/san.png", "Just you, me, and the stars. Tap the cafe racer when you want to head back inside.");
  }

  function goInside() {
    isOutside = false;
    document.body.classList.remove("outside-mode");
    typeText("Ria", "assets/ria.png", "Back in our cozy room!");
  }

  function advanceDialogue() {
    if (isOutside) {
      goInside();
    } else {
      interactCouple();
    }
  }

  const audio = document.getElementById("bg-audio");
  function toggleAudio() {
    const btn = document.getElementById("music-btn");
    if (audio.paused) {
      audio.play();
      btn.innerText = "Music: ON";
    } else {
      audio.pause();
      btn.innerText = "Music: OFF";
    }
  }

  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");
  let particles = [];

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function addParticle(type) {
    const colors = ["#ff4081", "#f06292", "#f48fb1", "#ff80ab", "#e91e63"];
    particles.push({
      x: Math.random() * canvas.width,
      y: canvas.height + 10,
      size: Math.floor(Math.random() * 4 + 4),
      speedY: Math.random() * 2 + 1.5,
      speedX: (Math.random() - 0.5) * 1.5,
      color: colors[Math.floor(Math.random() * colors.length)],
      type: type || "square"
    });
  }

  function triggerConfetti() { for (let i = 0; i < 40; i++) { setTimeout(() => addParticle("square"), i * 20); } }
  function triggerHearts() { for (let i = 0; i < 20; i++) { setTimeout(() => addParticle("heart"), i * 30); } }
  function triggerPetals() { for (let i = 0; i < 25; i++) { setTimeout(() => addParticle("petal"), i * 25); } }
  function triggerNotes() { for (let i = 0; i < 15; i++) { setTimeout(() => addParticle("note"), i * 40); } }

  function updateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < particles.length; i++) {
      let p = particles[i];
      p.y -= p.speedY;
      p.x += p.speedX;

      ctx.fillStyle = p.color;
      // Render all celebration effects as pink pixel hearts
      ctx.fillRect(p.x, p.y, p.size, p.size);
      ctx.fillRect(p.x - p.size, p.y - p.size, p.size, p.size);
      ctx.fillRect(p.x + p.size, p.y - p.size, p.size, p.size);
      ctx.fillRect(p.x - p.size * 2, p.y, p.size, p.size);
      ctx.fillRect(p.x + p.size * 2, p.y, p.size, p.size);
      ctx.fillRect(p.x - p.size, p.y + p.size, p.size, p.size);
      ctx.fillRect(p.x + p.size, p.y + p.size, p.size, p.size);
      ctx.fillRect(p.x, p.y + p.size * 2, p.size, p.size);

      if (p.y < -20) {
        particles.splice(i, 1);
        i--;
      }
    }
    requestAnimationFrame(updateParticles);
  }
  updateParticles();
</script>
</body>
</html>
