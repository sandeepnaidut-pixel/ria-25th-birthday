<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 25th Birthday Ria!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-wall: #fce4ec;
      --bg-floor: #d7ccc8;
      --dialogue-bg: #2d1b2e;
      --dialogue-border: #f8bbd0;
      --dialogue-text: #ffffff;
      --accent: #e91e63;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      user-select: none;
    }

    body {
      background-color: #121212;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100vw;
      max-width: 440px;
      height: 100vh;
      max-height: 820px;
      background: linear-gradient(to bottom, var(--bg-wall) 68%, var(--bg-floor) 68%);
      border: 4px solid #4a3b32;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    canvas#particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Top Controls */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      z-index: 20;
    }

    .pixel-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 6px 10px;
      background: #ffffff;
      border: 3px solid #000000;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000000;
    }

    .pixel-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #000000;
    }

    /* Room Scene */
    .room-scene {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 14px 18px 14px;
      gap: 8px;
    }

    .interactive-item {
      cursor: pointer;
      transition: transform 0.1s ease;
      position: relative;
    }

    .interactive-item:hover {
      transform: scale(1.04);
    }

    /* Sprites */
    .couple-wrapper {
      flex: 0 0 auto;
      text-align: center;
      animation: idleBob 1.4s ease-in-out infinite alternate;
      z-index: 5;
    }

    .couple-img {
      max-height: 270px;
      width: auto;
      display: block;
    }

    @keyframes idleBob {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }

    /* Furniture & Side Table */
    .furniture-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 0 0 auto;
      z-index: 5;
    }

    .table-top-items {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin-bottom: -2px;
    }

    .vase-img {
      max-height: 120px;
      width: auto;
      display: block;
    }

    /* Pixel Cake */
    .cake-container {
      width: 72px;
      height: 44px;
      background: #f8bbd0;
      border: 3px solid #4a3b32;
      border-radius: 4px;
      position: relative;
      display: flex;
      justify-content: center;
      cursor: pointer;
    }

    .cake-frosting {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 12px;
      background: #ffffff;
      border-bottom: 3px dashed #e91e63;
    }

    .candle {
      position: absolute;
      top: -14px;
      width: 6px;
      height: 14px;
      background: #81d4fa;
      border: 2px solid #000000;
    }

    .candle-1 { left: 20px; }
    .candle-2 { right: 20px; }

    .flame {
      position: absolute;
      top: -9px;
      left: -2px;
      width: 6px;
      height: 8px;
      background: #ffeb3b;
      border: 1px solid #ff5722;
      animation: flicker 0.3s infinite alternate;
    }

    .flame.extinguished {
      display: none;
    }

    .cake-label {
      position: absolute;
      bottom: 4px;
      font-size: 10px;
      color: #880e4f;
    }

    .table-stand {
      width: 150px;
      height: 48px;
      background: #bcaaa4;
      border: 3px solid #4a3b32;
      border-top: 5px solid #8d6e63;
      border-radius: 2px;
    }

    @keyframes flicker {
      0% { transform: scale(1); }
      100% { transform: scale(1.2) translateY(-1px); }
    }

    /* Dialogue Box */
    .dialogue-wrapper {
      padding: 12px;
      z-index: 20;
    }

    .dialogue-box {
      background: var(--dialogue-bg);
      border: 4px solid var(--dialogue-border);
      border-radius: 6px;
      display: flex;
      gap: 12px;
      padding: 10px;
      min-height: 100px;
      box-shadow: 0 4px 0 #000;
    }

    .portrait {
      width: 60px;
      height: 60px;
      border: 2px solid #ffffff;
      background: #000;
      flex-shrink: 0;
      overflow: hidden;
    }

    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .dialogue-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .speaker-name {
      color: #f48fb1;
      font-size: 10px;
      margin-bottom: 6px;
    }

    .dialogue-text {
      color: var(--dialogue-text);
      font-size: 9px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .dialogue-prompt {
      align-self: flex-end;
      font-size: 8px;
      color: #f8bbd0;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="particles"></canvas>

  <div class="top-bar">
    <button class="pixel-btn" id="music-btn" onclick="toggleAudio()">Music: OFF</button>
    <button class="pixel-btn" onclick="triggerConfetti()">Celebrate</button>
  </div>

  <div class="room-scene">
    <div class="couple-wrapper interactive-item" onclick="interactCouple()">
      <img src="assets/couple.png" alt="San and Ria" class="couple-img" id="couple-sprite" />
    </div>

    <div class="furniture-group">
      <div class="table-top-items">
        <div class="interactive-item" onclick="interactFlowers()">
          <img src="assets/flowers.png" alt="Bouquet" class="vase-img" />
        </div>

        <div class="cake-container interactive-item" onclick="blowCandles()">
          <div class="candle candle-1"><div class="flame" id="flame1"></div></div>
          <div class="candle candle-2"><div class="flame" id="flame2"></div></div>
          <div class="cake-frosting"></div>
          <span class="cake-label">25</span>
        </div>
      </div>
      <div class="table-stand"></div>
    </div>
  </div>

  <div class="dialogue-wrapper" onclick="advanceDialogue()">
    <div class="dialogue-box">
      <div class="portrait">
        <img id="portrait-img" src="assets/san.png" alt="Portrait" />
      </div>
      <div class="dialogue-content">
        <div>
          <div class="speaker-name" id="speaker-name">San</div>
          <div class="dialogue-text" id="dialogue-text">Tap anywhere in the room to explore...</div>
        </div>
        <div class="dialogue-prompt">[Tap to continue]</div>
      </div>
    </div>
  </div>
</div>

<audio id="bg-audio" loop src="assets/music.mp3"></audio>

<script>
  let candlesBlown = false;
  let typingTimer = null;

  const script = {
    intro: {
      speaker: "San",
      portrait: "assets/san.png",
      text: "Happy 25th Birthday, Ria! Welcome to your room."
    },
    flowers: {
      speaker: "San",
      portrait: "assets/san.png",
      text: "A fresh bouquet of blue lilies for your special day!"
    },
    cake: {
      speaker: "Ria",
      portrait: "assets/ria.png",
      text: "Make a wish! 25 is going to be our best year yet."
    },
    couple: {
      speaker: "San",
      portrait: "assets/san.png",
      text: "September 9th is all about you. I love you, Bebo <3"
    }
  };

  function typeText(speaker, portrait, text) {
    clearTimeout(typingTimer);
    document.getElementById("speaker-name").textContent = speaker;
    document.getElementById("portrait-img").src = portrait;
    
    const textElem = document.getElementById("dialogue-text");
    textElem.textContent = "";
    let i = 0;

    function step() {
      if (i <= text.length) {
        textElem.textContent = text.slice(0, i);
        i++;
        typingTimer = setTimeout(step, 30);
      }
    }
    step();
  }

  function interactCouple() {
    typeText(script.couple.speaker, script.couple.portrait, script.couple.text);
    triggerHearts();
  }

  function interactFlowers() {
    typeText(script.flowers.speaker, script.flowers.portrait, script.flowers.text);
    triggerPetals();
  }

  function blowCandles() {
    if (!candlesBlown) {
      document.getElementById("flame1").classList.add("extinguished");
      document.getElementById("flame2").classList.add("extinguished");
      candlesBlown = true;
      typeText(script.cake.speaker, script.cake.portrait, script.cake.text);
      triggerConfetti();
    } else {
      typeText(script.cake.speaker, script.cake.portrait, "The candles are out, but the wish is already set in stone!");
    }
  }

  function advanceDialogue() {
    interactCouple();
  }

  /* Audio Controls */
  const audio = document.getElementById("bg-audio");
  function toggleAudio() {
    const btn = document.getElementById("music-btn");
    if (audio.paused) {
      audio.play();
      btn.innerText = "Music: ON";
    } else {
      audio.pause();
      btn.innerText = "Music: OFF";
    }
  }

  /* Particle Canvas */
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");
  let particles = [];

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function addParticle(type) {
    const colors = ["#ff4081", "#e040fb", "#ffd700", "#69f0ae", "#64b5f6"];
    particles.push({
      x: Math.random() * canvas.width,
      y: canvas.height + 10,
      size: Math.floor(Math.random() * 4 + 4),
      speedY: Math.random() * 2 + 1.5,
      speedX: (Math.random() - 0.5) * 1.5,
      color: colors[Math.floor(Math.random() * colors.length)],
      type: type || "square"
    });
  }

  function triggerConfetti() {
    for (let i = 0; i < 40; i++) {
      setTimeout(() => addParticle("square"), i * 20);
    }
  }

  function triggerHearts() {
    for (let i = 0; i < 20; i++) {
      setTimeout(() => addParticle("heart"), i * 30);
    }
  }

  function triggerPetals() {
    for (let i = 0; i < 25; i++) {
      setTimeout(() => addParticle("petal"), i * 25);
    }
  }

  function updateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < particles.length; i++) {
      let p = particles[i];
      p.y -= p.speedY;
      p.x += p.speedX;

      ctx.fillStyle = p.color;
      if (p.type === "heart") {
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.fillRect(p.x - p.size, p.y - p.size, p.size, p.size);
        ctx.fillRect(p.x + p.size, p.y - p.size, p.size, p.size);
      } else {
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }

      if (p.y < -20) {
        particles.splice(i, 1);
        i--;
      }
    }
    requestAnimationFrame(updateParticles);
  }
  updateParticles();
</script>
</body>
</html>
